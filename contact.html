<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact Miesy Sketch by Mags G." />
    <title>Contact Me — Miesy Sketch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="category.css" />
  </head>
  <body class="category-page">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Miesysketch home">
        <img src="miesy-wordmark.png" alt="Miesy Sketch" />
      </a>
      <nav aria-label="Primary navigation">
<a href="about.html">About Me</a><a href="paintings.html">Paintings</a><a href="drawings.html">Drawings</a><a href="film-works.html">Film Works</a><a href="tattoo-portfolio.html">Tattoo Portfolio</a><a href="notes.html">Images</a><a href="contact.html" aria-current="page">Contact Me</a>
</nav>
    </header>

    <header class="category-header contact-header">
      <h1 class="image-title contact-title">
        <img src="contact-title.png" alt="Contact Me" />
      </h1>
      <img class="contact-intro" src="contact-intro.png" alt="Leave a message, story, note, or anything you want to share." />
    </header>

    <main class="contact-page-copy">
      <form class="contact-form" action="mailto:miesysketchh@hotmail.com" method="post" enctype="text/plain">
        <label for="contact-name">Your name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required />

        <label for="contact-email">Your email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required />

        <label for="contact-message">Your message, story, or note</label>
        <textarea id="contact-message" name="message" rows="9" required></textarea>

        <button type="submit">Send it ↗</button>
      </form>
      <div class="contact-direct-links" aria-label="Direct contact links">
        <a href="mailto:miesysketchh@hotmail.com">Email Mags ↗</a>
        <a href="https://www.instagram.com/miesy_art/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      </div>
    </main>

    <footer class="site-footer category-footer">
      <a href="index.html">Back to archive ↑</a>
    </footer>
  </body>
</html>
