<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Drawings — Miesy Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="category.css">
  </head>
  <body class="category-page">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Miesysketch home"><img src="miesy-wordmark.png" alt="Miesy Sketch"></a>
      <nav aria-label="Primary navigation">
        <a href="about.html">About Me</a><a href="paintings.html">Paintings</a><a href="drawings.html">Drawings</a><a href="film-works.html">Film Works</a><a href="installations.html">Installations</a><a href="notes.html">Images</a><a href="contact.html">Contact Me</a>
      </nav>
    </header>
    <header class="category-header">
      <h1 class="image-title"><img src="drawings-title.png" alt="Drawings"></h1>
    </header>
    <main class="images-gallery drawings-gallery" aria-label="Drawings gallery">
      <article class="drawing-tile">
        <img src="drawings-page-01.jpg" alt="Pen drawing of objects arranged on a bedside table.">
        <h2>BEDSIDE TABLE</h2>
        <p>2024 / PEN ON PAPER / A4</p>
      </article>
      <article class="drawing-tile">
        <img src="drawings-page-02.png" alt="Digital drawing of flowers and leaves.">
        <h2>FLOWERS</h2>
        <p>2025 / DIGITAL DRAWING</p>
      </article>
      <article class="drawing-tile">
        <img src="drawings-page-03.png" alt="Layered digital self-portrait with a patterned bird.">
        <h2>OVERLAPPING SELF</h2>
        <p>2026 / DIGITAL DRAWING</p>
      </article>
      <article class="drawing-tile">
        <img src="drawings-page-04.png" alt="Blue-toned drawing of a person driving a car.">
        <h2>DRIVING AWAY</h2>
        <p>2025 / DIGITAL DRAWING</p>
      </article>
    </main>
    <div class="artwork-lightbox" id="drawings-lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="drawings-lightbox-title">
      <div class="lightbox-panel">
        <div class="lightbox-toolbar">
          <p id="drawings-lightbox-title"></p>
          <div>
            <button type="button" data-gallery-previous aria-label="Previous drawing">←</button>
            <button type="button" data-zoom-out aria-label="Zoom out">−</button>
            <button type="button" data-zoom-reset>Reset</button>
            <button type="button" data-zoom-in aria-label="Zoom in">+</button>
            <button type="button" data-gallery-next aria-label="Next drawing">→</button>
            <button type="button" data-lightbox-close aria-label="Close artwork viewer">×</button>
          </div>
        </div>
        <div class="lightbox-viewport">
          <img id="drawings-lightbox-image" alt="">
        </div>
      </div>
    </div>
    <footer class="site-footer category-footer"><a href="index.html">Back to archive ↑</a></footer>
    <script>
      const drawingTiles = [...document.querySelectorAll(".drawing-tile")];
      const lightbox = document.querySelector("#drawings-lightbox");
      const lightboxImage = document.querySelector("#drawings-lightbox-image");
      const lightboxTitle = document.querySelector("#drawings-lightbox-title");
      const lightboxViewport = document.querySelector(".lightbox-viewport");
      let currentDrawing = 0;
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let startPanX = 0;
      let startPanY = 0;

      function updateZoom() {
        lightboxImage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        lightboxImage.classList.toggle("is-zoomed", zoom > 1);
      }

      function resetView() {
        zoom = 1;
        panX = 0;
        panY = 0;
        updateZoom();
      }

      function showDrawing(index) {
        currentDrawing = (index + drawingTiles.length) % drawingTiles.length;
        const image = drawingTiles[currentDrawing].querySelector("img");
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightboxTitle.textContent = `${drawingTiles[currentDrawing].querySelector("h2").textContent} · ${currentDrawing + 1} / ${drawingTiles.length}`;
        resetView();
      }

      function openLightbox(index) {
        showDrawing(index);
        lightbox.hidden = false;
        document.body.classList.add("lightbox-open");
        lightbox.querySelector("[data-lightbox-close]").focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        document.body.classList.remove("lightbox-open");
        resetView();
        drawingTiles[currentDrawing].querySelector("img").focus();
      }

      drawingTiles.forEach((tile, index) => {
        const image = tile.querySelector("img");
        image.tabIndex = 0;
        image.setAttribute("role", "button");
        image.setAttribute("aria-label", `View ${tile.querySelector("h2").textContent} in gallery`);
        image.addEventListener("click", () => openLightbox(index));
        image.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openLightbox(index);
          }
        });
      });

      lightbox.querySelector("[data-gallery-previous]").addEventListener("click", () => showDrawing(currentDrawing - 1));
      lightbox.querySelector("[data-gallery-next]").addEventListener("click", () => showDrawing(currentDrawing + 1));
      lightbox.querySelector("[data-zoom-in]").addEventListener("click", () => {
        zoom = Math.min(zoom + .25, 4);
        updateZoom();
      });
      lightbox.querySelector("[data-zoom-out]").addEventListener("click", () => {
        zoom = Math.max(zoom - .25, 1);
        if (zoom === 1) {
          panX = 0;
          panY = 0;
        }
        updateZoom();
      });
      lightbox.querySelector("[data-zoom-reset]").addEventListener("click", resetView);

      lightboxImage.addEventListener("pointerdown", (event) => {
        if (zoom <= 1) return;
        isDragging = true;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        startPanX = panX;
        startPanY = panY;
        lightboxImage.setPointerCapture(event.pointerId);
        lightboxImage.classList.add("is-dragging");
      });
      lightboxImage.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        panX = startPanX + event.clientX - dragStartX;
        panY = startPanY + event.clientY - dragStartY;
        updateZoom();
      });
      function stopDragging(event) {
        if (!isDragging) return;
        isDragging = false;
        lightboxImage.releasePointerCapture?.(event.pointerId);
        lightboxImage.classList.remove("is-dragging");
      }
      lightboxImage.addEventListener("pointerup", stopDragging);
      lightboxImage.addEventListener("pointercancel", stopDragging);
      lightboxViewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        zoom = Math.min(Math.max(zoom + (event.deltaY < 0 ? .25 : -.25), 1), 4);
        if (zoom === 1) {
          panX = 0;
          panY = 0;
        }
        updateZoom();
      }, { passive: false });

      lightbox.querySelector("[data-lightbox-close]").addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (event) => {
        if (lightbox.hidden) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") showDrawing(currentDrawing - 1);
        if (event.key === "ArrowRight") showDrawing(currentDrawing + 1);
      });
    </script>
  </body>
</html>
